version: "3.8"
services:
  cowstorage:
    image: docker.io/pgsty/silo:latest

    container_name: cowstorage
    hostname: cowstorage
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - etc/policycow.env
    volumes:
      - ${HOME}/tmp/cowctl/minio:/data
    command: server /data --address :9000 --console-address :9001
    # command: server /data
    networks:
      internal:
        aliases:
          - cowstorage
      default:
        aliases:
          - cowstorage
  oscmcpservice:
    image: ghcr.io/opensecuritycompliance/opensecuritycompliance/oscmcpservice:latest-cf70c900
    container_name: oscmcpservice
    env_file:
      - etc/userconfig.env
      - etc/policycow.env
    ports:
      - "${OSC_MCP_PORT:-45678}:8080"
    volumes:
      - ./mcp-server:/home/cow-mcp
    networks:
      - internal
      - default
  # goose, serving ACP on :3000 to the bridge. Built on the published goose image
  # with this repo's config.yaml and recipes baked in, so edit those and rebuild.
  # No host port: the old 8976 served `goose web`, which no longer exists, and
  # ACP is reachable by the bridge over the internal network.
  # GOOSE_SERVER__SECRET_KEY must be set in etc/userconfig.env and match the
  # bridge's GOOSE_SERVER_SECRET_KEY.
  ccowmcpclient:
    build:
      context: .
      dockerfile: ./Dockerfiles/alpine/Dockerfile.ccowmcpclient
    image: ccowmcpclient:2.0
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./etc/userconfig.env
      - ./etc/policycow.env
    hostname: ccowmcpclient
    container_name: ccowmcpclient
    restart: always
    volumes:
      - ./mcp-sessions:/home/goose/.local/share/goose/sessions
      - ./mcp-state:/home/goose/.local/state/goose
    depends_on:
      - oscmcpservice
    networks:
      internal:
        aliases:
          - ccowmcpclient
      default:
        aliases:
          - ccowmcpclient
  # The bridge: browser WebSocket <-> goose ACP. Shares the sessions directory
  # with goose (it keeps cow_sessions.db there and reads goose's sessions.db).
  ccowmcpbridge:
    image: ghcr.io/opensecuritycompliance/opensecuritycompliance/ccowmcpbridge:2.0
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./etc/userconfig.env
      - ./etc/policycow.env
    environment:
      - GIN_MODE=release
      - GOOSE_SERVER_URL=http://ccowmcpclient:3000
    hostname: ccowmcpbridge
    container_name: ccowmcpbridge
    restart: always
    ports:
      - 8095:8080/tcp
    volumes:
      - ./mcp-sessions:/home/ccowclient/.local/share/ccowmcp/data/sessions
    depends_on:
      - ccowmcpclient
    networks:
      internal:
        aliases:
          - ccowmcpbridge
      default:
        aliases:
          - ccowmcpbridge
  oscwebserver:
    platform: linux/x86_64
    dns:
      - 8.8.8.8
      - 1.1.1.1
    image: ghcr.io/opensecuritycompliance/opensecuritycompliance/oscwebserver:1.4-20260729182658
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - etc/userconfig.env
      - etc/policycow.env
    hostname: oscwebserver
    container_name: oscwebserver
    restart: always
    ports:
      - 3001:80
    networks:
      internal:
        aliases:
          - oscwebserver
      default:
        aliases:
          - oscwebserver
  oscreverseproxy:
    platform: linux/x86_64
    container_name: oscreverseproxy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    image: ghcr.io/opensecuritycompliance/opensecuritycompliance/oscreverseproxy:latest-cf70c900
    env_file:
      - etc/userconfig.env
      - etc/policycow.env
    ports:
      - "${OSC_HTTPS_PORT:-443}:443"
      - "${OSC_HTTP_PORT:-80}:80"
    environment:
      - etc/userconfig.env
      - etc/policycow.env
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    depends_on:
      - oscapiservice
    networks:
      internal:
        aliases:
          - oscreverseproxy
      default:
        aliases:
          - oscreverseproxy
    volumes:
      - "./src/oscreverseproxy/certs:/etc/continube/certs"
    hostname: oscreverseproxy
    restart: always
  oscapiservice:
    platform: linux/x86_64
    dns:
      - 8.8.8.8
      - 1.1.1.1
    image: ghcr.io/opensecuritycompliance/opensecuritycompliance/oscapiservice:1.3
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - etc/userconfig.env
      - etc/policycow.env
    environment:
      - GIN_MODE=release
    volumes:
      - ./catalog/globalcatalog/dashboards:/policycow/catalog/globalcatalog/dashboards
      - ./catalog/globalcatalog/rules:/policycow/catalog/globalcatalog/rules
      - ./catalog/applicationtypes:/policycow/catalog/applicationtypes
      - ./catalog/applicationscope:/policycow/catalog/applicationscope
      - ./catalog/designnotes:/policycow/catalog/designnotes
      - ./catalog/globalcatalog/methods:/policycow/catalog/globalcatalog/methods
      - ./catalog/globalcatalog/rulegroups:/policycow/catalog/globalcatalog/rulegroups
      - ./catalog/globalcatalog/tasks:/policycow/catalog/globalcatalog/tasks
      - ./catalog/localcatalog/rules:/policycow/catalog/localcatalog/rules
      - ./catalog/localcatalog/:/policycow/catalog/localcatalog/
      - ./etc/cowconfig.yaml:/policycow/etc/cowconfig.yaml
      - ./exported-data:/policycow/exported-data
      - ./catalog/globalcatalog/declaratives/applicationtypes:/policycow/catalog/globalcatalog/declaratives/applicationtypes
      - ./catalog/globalcatalog/declaratives/credentialtypes:/policycow/catalog/globalcatalog/declaratives/credentialtypes
      - ./catalog/globalcatalog/yamlfiles/applicationtypes:/policycow/catalog/globalcatalog/yamlfiles/applicationtypes
      - ./catalog/globalcatalog/yamlfiles/credentialtypes:/policycow/catalog/globalcatalog/yamlfiles/credentialtypes
      - ./cowexecutions:/policycow/cowexecutions
      - ./mcp-sessions:/home/ccowclient/.local/share/ccowmcp/data/sessions
    hostname: oscapiservice
    container_name: oscapiservice
    depends_on:
      - cowstorage
    restart: always
    ports:
      - 9080:80
    networks:
      internal:
        aliases:
          - oscapiservice
      default:
        aliases:
          - oscapiservice
networks:
  default:
    name: osc_default
  internal:
    name: osc_internal
