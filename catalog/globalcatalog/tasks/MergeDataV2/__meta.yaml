type: python
tags:
- generic
applicationType: generic
userObjectJSONInBase64: ''
systemObjectJSONInBase64: ''
inputs:
- name: InputFile1 
  description: "First data file containing an array of records in json, ndjson, csv, or parquet format. Serves as the primary source to be merged with InputFile2. At least one input file must be provided for task execution."
  dataType: FILE 
  repeated: false 
  allowedValues: [] 
  defaultValue: <<MINIO_FILE_PATH>>
  showField: true 
  required: false 
- name: InputFile2 
  description: "Second data file containing an array of records in json, ndjson, csv, or parquet format. Merged with InputFile1 using the specified strategy: APPEND (additional rows) or CONCATENATE (additional columns). At least one input file must be provided."
  dataType: FILE 
  repeated: false 
  allowedValues: [] 
  defaultValue: <<MINIO_FILE_PATH>>
  showField: true 
  required: false 
- name: LogConfigFile 
  description: "Error management file with custom exception messages and templates for merge failures. Uses TOML with dynamic placeholders to provide clear error reporting for download issues, validation problems, and processing errors."
  dataType: FILE 
  repeated: false 
  templateFile: 
  format: toml
  allowedValues: [] 
  defaultValue: <<MINIO_FILE_PATH>>
  showField: true 
  required: false   
- name: MergeType 
  description: "Specifies how input files are combined. APPEND (default) stacks rows vertically; CONCATENATE joins columns horizontally. Choose based on whether to merge similar records or add fields to existing records."
  dataType: STRING
  repeated: false 
  allowedValues: ['APPEND', 'CONCATENATE'] 
  defaultValue: APPEND
  showField: true 
  required: false 
- name: OutputFileFormat
  description: "Target format for the conversion output. Supported options: JSON, CSV, PARQUET."
  dataType: STRING
  repeated: false
  allowedValues: [JSON, CSV, PARQUET]
  defaultValue: PARQUET
  showField: true
  required: false
- name: ProceedIfLogExists
  description: "Controls execution when previous log files exist. If enabled (default: true), merge runs and includes the log. If disabled (false), execution is skipped and the existing log is returned."
  dataType: BOOLEAN
  repeated: false 
  allowedValues: [true,false] 
  defaultValue: true
  showField: true 
  required: false 
- name: ProceedIfErrorExists
  description: "Error handling strategy for merge operations. If enabled (default: true), errors are logged and processing continues. If disabled (false), any error stops execution immediately."
  dataType: BOOLEAN
  repeated: false 
  allowedValues: [true,false] 
  defaultValue: true
  showField: true 
  required: false   
- name: LogFile
  description: "JSON log file from previous tasks containing error details and execution context. Determines whether the merge runs or skips based on existing errors and the ProceedIfLogExists setting."
  dataType: FILE
  repeated: false 
  allowedValues: [] 
  defaultValue: <<MINIO_FILE_PATH>>
  showField: true 
  required: false
- name: OutputFileName
  description: "Base name for the merged output file without extension. Default is 'OutputFile'."
  dataType: STRING
  repeated: false 
  allowedValues: [] 
  defaultValue: OutputFile
  showField: true 
  required: false
outputs:
- name: ComplianceStatus_
  description: Compliance status of the task
  dataType: STRING
- name: CompliancePCT_
  description: Compliance percentage of the task
  dataType: INT
- name: MergedData
  description: "Parquet file containing merged data from InputFile1 and InputFile2. APPEND stacks rows vertically, while CONCATENATE joins columns horizontally by record position."
  dataType: FILE
- name: LogFile
  description: "Error log recording exceptions, validation failures, and processing issues during the merge. Includes messages from LogConfigFile with dynamic placeholders for troubleshooting and debugging."
  dataType: FILE


