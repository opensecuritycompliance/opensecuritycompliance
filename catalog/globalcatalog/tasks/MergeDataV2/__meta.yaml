name: MergeDataV2
displayName: MergeDataV2
version: '1.0'
description: "Combine data from two input files using flexible merge strategies. Supports APPEND (stack rows vertically) and CONCATENATE (join columns horizontally by position). Handles multiple file formats with error handling for reliable integration."
