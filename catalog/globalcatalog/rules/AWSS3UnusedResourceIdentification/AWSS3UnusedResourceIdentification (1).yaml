apiVersion: rule.policycow.live/v1alpha1
kind: rule
meta:
  name: AWSS3UnusedResourceIdentification
  purpose: >-
    Identify unused S3 resources by analyzing bucket access patterns from
    CloudTrail logs and marking buckets as non-compliant if not accessed for 45
    days
  description: >-
    This rule fetches S3 buckets from AWS accounts, retrieves IAM users with S3
    access permissions, analyzes CloudTrail audit logs for S3 access activity,
    calculates days since last access, and determines compliance status based on
    a 45-day threshold where buckets without access are marked as NON_COMPLIANT
  labels:
    appType:
      - httprequest
    environment:
      - logical
    execlevel:
      - app
  annotations:
    annotateType:
      - httprequest
  tags:
    - MCP
  app: HttpRequest
spec:
  inputs:
    fetch_s3_buckets_RequestConfigFile: >-
      
    fetch_iam_users_RequestConfigFile: >-
      
    fetch_cloudtrail_logs_RequestConfigFile: >-
      
    analyze_access_JQTransform: |-
      map(.Events[])
      | map({
          BucketName: (.Resources[0].ResourceName // "Unknown"),
          UserIdentity: (
            .Username
            // (.CloudTrailEvent | fromjson | .userIdentity.userName)
           // "Unknown"
         ),
        EventName: .EventName,
        EventTime: .EventTime,
        EventSource: .EventSource,
        LastAccessDate: .EventTime,
        DaysSinceAccess: ((now - (.EventTime // now)) / 86400 | floor)
        })
    analyze_access_OutputMethod: ALL
    determine_compliance_JQTransform: |-
      map(
        . + {
          ComplianceStatus: (
            if .DaysSinceAccess > 45 then
              "NON_COMPLIANT"
            else
              "COMPLIANT"
            end
          ),
          ComplianceStatusReason: (
            if .DaysSinceAccess > 45 then
              "S3 bucket not accessed for more than 45 days"
            else
              "S3 bucket accessed within 45 days"
            end
          ),
          ValidationStatusCode: (
            if .DaysSinceAccess > 45 then
              "S3_NO_ACC_45D"
            else
              "S3_ACC_OK"
            end
          ),
          ValidationStatusNotes: (
            if .DaysSinceAccess > 45 then
              "Bucket has been inactive for \(.DaysSinceAccess) days"
            else
              "Bucket actively used"
            end
          )
        }
      )
    determine_compliance_OutputMethod: ALL
  inputsMeta__:
    - name: fetch_s3_buckets_RequestConfigFile
      dataType: HTTP_CONFIG
      defaultValue: >-
        http://cowstorage:9000/ruleinputs/AWSS3UnusedResourceIdentification/file_68887_ExecuteHttpRequestV2_RequestConfigFile.toml
      format: toml
      showField: true
      required: true
      allowedValues: []
      repeated: false
      explanation: ''
    - name: fetch_iam_users_RequestConfigFile
      dataType: HTTP_CONFIG
      defaultValue: >-
        http://cowstorage:9000/ruleinputs/AWSS3UnusedResourceIdentification/file_82912_ExecuteHttpRequestV2_RequestConfigFile.toml
      format: toml
      showField: true
      required: true
      allowedValues: []
      repeated: false
      explanation: ''
    - name: fetch_cloudtrail_logs_RequestConfigFile
      dataType: HTTP_CONFIG
      defaultValue: >-
        http://cowstorage:9000/ruleinputs/AWSS3UnusedResourceIdentification/file_82820_ExecuteHttpRequestV2_RequestConfigFile.toml
      format: toml
      showField: true
      required: true
      allowedValues: []
      repeated: false
      explanation: ''
    - name: analyze_access_JQTransform
      dataType: JQ_EXPRESSION
      defaultValue: |-
        map({
          BucketName: (.Resources[0].ResourceName // "Unknown"),
          UserIdentity: (.Username // .UserIdentity.principalId // "Unknown"),
          EventName: .EventName,
          EventTime: .EventTime,
          EventSource: .EventSource,
          LastAccessDate: .EventTime,
          DaysSinceAccess: ((now - ((.EventTime // now | fromdateiso8601))) / 86400 | floor)
        })
      showField: true
      required: true
      allowedValues: []
      repeated: false
      explanation: ''
    - name: analyze_access_OutputMethod
      dataType: STRING
      defaultValue: ALL
      showField: true
      required: true
      allowedValues:
        - ALL
        - FIRST
      repeated: false
      explanation: ''
    - name: determine_compliance_JQTransform
      dataType: JQ_EXPRESSION
      defaultValue: |-
        map(. + {
          ComplianceStatus: (if .DaysSinceAccess > 45 then "NON_COMPLIANT" else "COMPLIANT" end),
          ComplianceStatusReason: (if .DaysSinceAccess > 45 then "S3 bucket not accessed for more than 45 days" else "S3 bucket accessed within 45 days" end),
          ValidationStatusCode: (if .DaysSinceAccess > 45 then "S3_NO_ACC_45D" else "S3_ACC_OK"),
          ValidationStatusNotes: (if .DaysSinceAccess > 45 then "Bucket has been inactive for \(.DaysSinceAccess) days" else "Bucket actively used")
        })
      showField: true
      required: true
      allowedValues: []
      repeated: false
      explanation: ''
    - name: determine_compliance_OutputMethod
      dataType: STRING
      defaultValue: ALL
      showField: true
      required: true
      allowedValues:
        - ALL
        - FIRST
      repeated: false
      explanation: ''
  tasks:
    - name: ExecuteHttpRequestV2
      alias: fetch_s3_buckets
      type: task
      description: Detailed info about the task
      appTags:
        appType:
          - httprequest
        environment:
          - logical
        execlevel:
          - app
    - name: ExecuteHttpRequestV2
      alias: fetch_iam_users
      type: task
      description: Detailed info about the task
      appTags:
        appType:
          - httprequest
        environment:
          - logical
        execlevel:
          - app
    - name: ExecuteHttpRequestV2
      alias: fetch_cloudtrail_logs
      type: task
      description: Detailed info about the task
      appTags:
        appType:
          - httprequest
        environment:
          - logical
        execlevel:
          - app
    - name: TransformDataWithJQ
      alias: analyze_access
      type: task
      description: Detailed info about the task
      appTags:
        appType:
          - nocredapp
        environment:
          - logical
        execlevel:
          - app
    - name: TransformDataWithJQ
      alias: determine_compliance
      type: task
      description: Detailed info about the task
      appTags:
        appType:
          - nocredapp
        environment:
          - logical
        execlevel:
          - app
  ioMap:
    - >-
      fetch_s3_buckets.Input.RequestConfigFile:=*.Input.fetch_s3_buckets_RequestConfigFile
    - >-
      fetch_iam_users.Input.RequestConfigFile:=*.Input.fetch_iam_users_RequestConfigFile
    - >-
      fetch_cloudtrail_logs.Input.RequestConfigFile:=*.Input.fetch_cloudtrail_logs_RequestConfigFile
    - analyze_access.Input.InputFile:=fetch_cloudtrail_logs.Output.OutputFile
    - analyze_access.Input.JQTransform:=*.Input.analyze_access_JQTransform
    - analyze_access.Input.OutputMethod:=*.Input.analyze_access_OutputMethod
    - >-
      determine_compliance.Input.InputFile:=analyze_access.Output.TransformedFile
    - >-
      determine_compliance.Input.JQTransform:=*.Input.determine_compliance_JQTransform
    - >-
      determine_compliance.Input.OutputMethod:=*.Input.determine_compliance_OutputMethod
    - >-
      *.Output.S3UnusedResourceReport:=determine_compliance.Output.TransformedFile
    - >-
      *.Output.ExtendedData_S3AccessLogs:=determine_compliance.Output.TransformedFile
    - '*.Output.CompliancePCT_:=determine_compliance.Output.CompliancePCT_'
    - '*.Output.ComplianceStatus_:=determine_compliance.Output.ComplianceStatus_'
    - '*.Output.LogFile:=determine_compliance.Output.LogFile'
  outputsMeta__:
    - name: S3UnusedResourceReport
      dataType: FILE
      description: >-
        Standard schema compliance report for S3 unused resources with mandatory
        fields
      repeated: false
      allowedValues: []
      defaultValue: <<MINIO_FILE_PATH>>
      showField: true
      required: true
    - name: ExtendedData_S3AccessLogs
      dataType: FILE
      description: Extended schema with complete raw CloudTrail and compliance data
      repeated: false
      allowedValues: []
      defaultValue: <<MINIO_FILE_PATH>>
      showField: true
      required: true
    - name: LogFile
      dataType: FILE
      description: Error log file with execution details
      repeated: false
      allowedValues: []
      defaultValue: <<MINIO_FILE_PATH>>
      showField: true
      required: true
