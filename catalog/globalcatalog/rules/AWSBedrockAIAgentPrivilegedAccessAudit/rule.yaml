apiVersion: rule.policycow.live/v1alpha1
kind: rule
meta:
  name: AWSBedrockAIAgentPrivilegedAccessAudit
  purpose: >-
    Identify and audit AWS Bedrock AI agents with privileged access, tracking
    who invokes them, and flag as NON_COMPLIANT for mandatory manual review due
    to autonomous decision-making risks
  description: >-
    This rule audits AWS Bedrock AI agents (both native agents and custom
    applications using Bedrock APIs) to identify those with privileged IAM
    permissions. It tracks invocation history to determine who invokes each
    agent (humans vs service accounts), detects privileged access patterns
    including IAM admin rights, data destruction capabilities, and AI-calling-AI
    scenarios, and flags all privileged AI agents as NON_COMPLIANT with detailed
    reasoning about autonomous operation risks, prompt injection
    vulnerabilities, and accountability concerns.
  labels:
    appType:
      - httprequest
    environment:
      - logical
    execlevel:
      - app
    service:
      - bedrock
  annotations:
    annotateType:
      - httprequest
  tags:
    - MCP
  app: HttpRequest
