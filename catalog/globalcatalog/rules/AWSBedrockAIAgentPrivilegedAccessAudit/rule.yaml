    FormatDateTimeJQConfigFile: <<MINIO_FILE_PATH>>
    GetCloudTrialDetailsRequestConfig: <<MINIO_FILE_PATH>>
    GetAWSAccountIdRequestConfig: <<MINIO_FILE_PATH>>
    FilterS3BucketDetailsJQConfigFile: <<MINIO_FILE_PATH>>
    MergeType: CONCATENATE
    OutputFileFormat: JSON
    QueryCloudWatchLogsRequestConfig: <<MINIO_FILE_PATH>>
    GetQueryResultRequestConfig: <<MINIO_FILE_PATH>>
    FormatQueryResponseJQConfigFile: <<MINIO_FILE_PATH>>
