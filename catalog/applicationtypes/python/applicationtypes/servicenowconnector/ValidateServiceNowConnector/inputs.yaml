userObject:
  name: ServiceNowConnector
userInputs:
  BucketName: demo
  appPort: 0
  appURL: https://<instance>.service-now.com
  userDefinedCredentials:
    OAuth:
      ClientID: "$CLIENT_ID"
      ClientSecret: "$CLIENT_SECRET"
    SNOW: 
      UserName: "$SERVICE_NOW_USERNAME"
      Password: "$SERVICE_NOW_PASSWORD"
